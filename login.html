<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login | LocalTalkKit</title>

<style>
:root{
--bg:#f7f8fc;
--surface:#fff;
--purple:#5b3df5;
--purple-dark:#452dcc;
--muted:#687286;
--line:#e6e9f1;
--ink:#171b2d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,system-ui,sans-serif;
background:var(--bg);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-card{
background:var(--surface);
width:100%;
max-width:420px;
padding:40px;
border-radius:24px;
box-shadow:0 12px 40px rgba(0,0,0,.08);
border:1px solid var(--line);
}

.logo{
text-align:center;
font-size:30px;
margin-bottom:12px;
}

h1{
text-align:center;
font-size:32px;
font-weight:900;
color:var(--ink);
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:var(--muted);
margin-bottom:35px;
font-size:15px;
line-height:1.5;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-size:14px;
font-weight:700;
margin-bottom:7px;
color:var(--ink);
}

input{
width:100%;
height:52px;
padding:0 15px;
font-size:15px;
border-radius:12px;
border:1px solid #d8dbe5;
outline:none;
transition:.2s;
}

input:focus{
border-color:var(--purple);
box-shadow:0 0 0 4px rgba(91,61,245,.15);
}

.login-btn{
width:100%;
height:55px;
border:none;
border-radius:12px;
background:var(--purple);
color:white;
font-size:15px;
font-weight:800;
cursor:pointer;
margin-top:8px;
transition:.2s;
}

.login-btn:hover{
background:var(--purple-dark);
transform:translateY(-1px);
}

.help{
margin-top:24px;
text-align:center;
font-size:13px;
color:var(--muted);
line-height:1.6;
}

.help strong{
color:var(--ink);
}

.footer{
margin-top:18px;
text-align:center;
font-size:12px;
color:#888;
}

.error{
display:none;
background:#ffe8e8;
color:#c62828;
padding:12px;
border-radius:10px;
margin-bottom:15px;
font-size:14px;
text-align:center;
}
</style>
</head>

<body>

<div class="login-card">


<h1>Welcome to 🇲🇦</h1>

<p class="subtitle">
Access your Darija Survival Kit and prepare for a smoother Morocco experience.
</p>

<div id="errorBox" class="error">
Invalid login credentials.
</div>

<form id="loginForm">

<div class="form-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="your@email.com"
required
>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
id="password"
placeholder="••••••••"
required
>
</div>

<button type="submit" class="login-btn">
Access My Survival Kit →
</button>

</form>

<div class="help">
Access is provided by your travel company.
<br><br>
<strong>Need help?</strong><br>
support@localtalkkit.com
</div>

<div class="footer">
LocalTalkKit © 2026
</div>

</div>

<script>

/*
TEMP LOGIN

Replace with Supabase later.

Demo:
demo@localtalkkit.com
Morocco2026

*/

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(
email === "demo@localtalkkit.com" &&
password === "Morocco2026"
){

window.location.href =
"/dashboard.html";

}
else{

document.getElementById("errorBox")
.style.display = "block";

}

});

</script>

</body>
</html>
